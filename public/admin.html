<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#08080a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Berg Castle Admin" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>Berg Castle · Admin</title>
  <style>
    :root {
      --bg-0:#08080a; --bg-1:#0f0f13; --bg-2:#16161c; --bg-3:#1e1e26; --bg-4:#26262f;
      --line:#2a2a34; --line-strong:#3a3a44;
      --text:#f4f4f7; --text-mid:#b8b8c0; --text-dim:#7a7a84; --text-dimmer:#5a5a64;
      --accent:#ffb84d; --accent-bright:#ffce7c; --accent-dim:#b8823a; --accent-glow:rgba(255,184,77,.35);
      --danger:#ff6a5c; --danger-dim:#b34c40; --success:#58e874;
      --font-body:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display',system-ui,sans-serif;
      --font-mono:'SF Mono','JetBrains Mono',Menlo,ui-monospace,monospace;
      --ease:cubic-bezier(.4,0,.2,1);
      --safe-top:env(safe-area-inset-top,0); --safe-bottom:env(safe-area-inset-bottom,0);
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { background:var(--bg-0); color:var(--text); font-family:var(--font-body);
      -webkit-font-smoothing:antialiased; min-height:100%; }
    body { padding:calc(var(--safe-top) + 20px) 18px calc(var(--safe-bottom) + 40px);
      max-width:640px; margin:0 auto; }
    a { color:var(--accent); text-decoration:none; }

    header { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
    .back { width:38px; height:38px; border-radius:12px; background:var(--bg-2);
      border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
      font-size:20px; color:var(--text-mid); transition:all var(--ease) 120ms; }
    .back:active { background:var(--bg-3); transform:scale(.94); }
    h1 { font-size:22px; font-weight:650; letter-spacing:-.02em; }
    .sub { color:var(--text-dim); font-size:13px; margin:2px 0 24px 50px; }
    .whoami { color:var(--accent-dim); font-family:var(--font-mono); font-size:11px; }

    .card { background:var(--bg-1); border:1px solid var(--line); border-radius:18px;
      padding:20px; margin-bottom:18px; }
    .card h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
      color:var(--text-dim); margin-bottom:16px; }

    .add-row { display:flex; gap:10px; margin-bottom:6px; }
    input[type=email] { flex:1; background:var(--bg-3); border:1px solid var(--line-strong);
      border-radius:12px; padding:14px 16px; color:var(--text); font-size:16px; font-family:var(--font-body);
      transition:border-color var(--ease) 120ms; }
    input[type=email]:focus { outline:none; border-color:var(--accent-dim); }
    input[type=email]::placeholder { color:var(--text-dimmer); }
    button.add { background:var(--accent); color:#1a1206; border:none; border-radius:12px;
      padding:0 20px; font-size:15px; font-weight:650; transition:all var(--ease) 120ms; }
    button.add:active { transform:scale(.95); background:var(--accent-bright); }
    button.add:disabled { opacity:.4; }

    ul.users { list-style:none; }
    ul.users li { display:flex; align-items:center; gap:12px; padding:14px 4px;
      border-bottom:1px solid var(--line); }
    ul.users li:last-child { border-bottom:none; }
    .email { flex:1; font-size:15px; word-break:break-all; }
    .badge { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      padding:3px 8px; border-radius:6px; background:var(--accent-glow); color:var(--accent-bright); }
    button.rm { background:transparent; border:1px solid var(--line-strong); color:var(--danger);
      border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600;
      transition:all var(--ease) 120ms; }
    button.rm:active { background:var(--danger-dim); color:#fff; transform:scale(.95); }

    .hint { color:var(--text-dim); font-size:12.5px; line-height:1.6; margin-top:14px; }
    .toast { position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 24px); transform:translateX(-50%);
      background:var(--bg-4); border:1px solid var(--line-strong); color:var(--text);
      padding:12px 20px; border-radius:14px; font-size:14px; opacity:0; pointer-events:none;
      transition:opacity var(--ease) 200ms, transform var(--ease) 200ms; z-index:50; max-width:90vw; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }
    .toast.err { border-color:var(--danger-dim); color:#ffd7d2; }
    .toast.ok { border-color:var(--success); }
    .empty { color:var(--text-dimmer); font-size:14px; padding:8px 4px; }
    .spin { color:var(--text-dim); font-size:14px; padding:8px 4px; }
    .gate { text-align:center; padding:60px 20px; color:var(--text-dim); }
    .gate strong { color:var(--danger); display:block; font-size:17px; margin-bottom:8px; }
    .vlabel { display:block; font-size:13px; font-weight:600; margin:6px 0 6px; }
    .vsub { font-weight:400; opacity:0.6; font-size:12px; }
    .vtext { width:100%; box-sizing:border-box; background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.14); border-radius:10px; color:inherit;
      font:inherit; font-size:14px; padding:10px 12px; resize:vertical; line-height:1.45; }
    .vtext:focus { outline:none; border-color:var(--accent, #e8a13a); }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/" aria-label="Back to panel">‹</a>
    <div>
      <h1>Admin</h1>
    </div>
  </header>
  <div class="sub" id="whoami"></div>

  <div id="content">
    <div class="card"><div class="spin">Loading…</div></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (s, r=document) => r.querySelector(s);
    const toastEl = $('#toast');
    let toastTimer;
    function toast(msg, kind='') {
      toastEl.textContent = msg;
      toastEl.className = 'toast show ' + kind;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.className = 'toast ' + kind; }, 2600);
    }

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || j.error || ('HTTP ' + r.status));
      return j;
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function render(data) {
      const owners = new Set((data.owners || []).map(e => e.toLowerCase()));
      const users = data.users || [];
      const rows = users.map(e => {
        const isOwner = owners.has(e.toLowerCase());
        return `<li>
          <span class="email">${esc(e)}</span>
          ${isOwner ? '<span class="badge">owner</span>'
                    : `<button class="rm" data-email="${esc(e)}">Remove</button>`}
        </li>`;
      }).join('');

      $('#content').innerHTML = `
        <div class="card">
          <h2>Invite someone</h2>
          <div class="add-row">
            <input type="email" id="newEmail" placeholder="name@email.com"
              autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="email" />
            <button class="add" id="addBtn">Add</button>
          </div>
          <div class="hint">They visit <strong>home.bergcastle.com</strong>, choose the email login,
            get a 6-digit code in their inbox, and they're in. On iPhone: Share → Add to Home Screen
            to install the app.</div>
        </div>
        <div class="card">
          <h2>Who has access</h2>
          <ul class="users">${rows || '<li class="empty">No users yet.</li>'}</ul>
        </div>
        <div class="card">
          <h2>Jony — voice agent</h2>
          <div class="hint">The voice of Berg Castle. Edit how it behaves and what it remembers.
            Changes apply on the next voice session.</div>
          <label class="vlabel">Live system prompt <span class="vsub">(read-only — built fresh from house data each session; includes your override + memory below)</span></label>
          <textarea id="vBase" class="vtext" rows="8" readonly style="opacity:0.75"></textarea>
          <label class="vlabel" style="margin-top:14px">System prompt override <span class="vsub">(your custom additions — layered on top of the built-in instructions)</span></label>
          <textarea id="vPrompt" class="vtext" rows="5" placeholder="e.g. Be extra concise. Call the master bedroom &quot;our room&quot;."></textarea>
          <div class="add-row"><button class="add" id="savePromptBtn">Save prompt</button></div>
          <label class="vlabel" style="margin-top:14px">Memory <span class="vsub">(things Jony has been told to remember, newest dates at the bottom — prune freely)</span></label>
          <textarea id="vMemory" class="vtext" rows="8" placeholder="(empty — say &quot;Jony, remember...&quot; on voice to add facts)"></textarea>
          <div class="add-row"><button class="add" id="saveMemoryBtn">Save memory</button></div>
        </div>`;

      // Voice agent: load + wire save buttons.
      (async () => {
        try {
          const vm = await api('GET', '/api/admin/voice-memory');
          $('#vBase').value = vm.basePrompt || '(could not load)';
          $('#vPrompt').value = vm.promptOverride || '';
          $('#vMemory').value = vm.memory || '';
        } catch (_) {}
      })();
      $('#savePromptBtn').onclick = async () => {
        const btn = $('#savePromptBtn'); btn.disabled = true;
        try {
          await api('PUT', '/api/admin/voice-prompt', { promptOverride: $('#vPrompt').value });
          toast('Prompt saved', 'ok');
        } catch (e) { toast(e.message, 'err'); } finally { btn.disabled = false; }
      };
      $('#saveMemoryBtn').onclick = async () => {
        const btn = $('#saveMemoryBtn'); btn.disabled = true;
        try {
          const res = await api('PUT', '/api/admin/voice-memory', { memory: $('#vMemory').value });
          $('#vMemory').value = res.memory || '';
          toast('Memory saved', 'ok');
        } catch (e) { toast(e.message, 'err'); } finally { btn.disabled = false; }
      };

      const addBtn = $('#addBtn'), input = $('#newEmail');
      const doAdd = async () => {
        const email = input.value.trim();
        if (!email) return;
        addBtn.disabled = true;
        try {
          const res = await api('POST', '/api/admin/users', { email });
          input.value = '';
          let msg;
          if (!res.added) msg = res.note || 'Already had access';
          else if (res.invited) msg = `Added \u2014 invite emailed to ${email}`;
          else msg = `Added ${email} (invite email pending: ${res.inviteReason || 'not sent'})`;
          toast(msg, res.added && !res.invited ? 'err' : 'ok');
          render({ ...data, users: res.users });
        } catch (e) { toast(e.message, 'err'); }
        finally { addBtn.disabled = false; }
      };
      addBtn.onclick = doAdd;
      input.onkeydown = (ev) => { if (ev.key === 'Enter') doAdd(); };

      document.querySelectorAll('button.rm').forEach(btn => {
        btn.onclick = async () => {
          const email = btn.dataset.email;
          if (!confirm(`Remove access for ${email}?`)) return;
          btn.disabled = true;
          try {
            const res = await api('DELETE', '/api/admin/users', { email });
            toast(res.removed ? `Removed ${email}` : (res.note || 'Not on the list'), 'ok');
            render({ ...data, users: res.users });
          } catch (e) { toast(e.message, 'err'); btn.disabled = false; }
        };
      });
    }

    async function boot() {
      try {
        const who = await api('GET', '/api/admin/whoami');
        $('#whoami').innerHTML = `<span class="whoami">signed in as ${esc(who.email || 'unknown')}</span>`;
        const data = await api('GET', '/api/admin/users');
        render(data);
      } catch (e) {
        $('#content').innerHTML = `<div class="gate">
          <strong>Access denied</strong>
          This area is for the house owner only.<br>${esc(e.message)}
        </div>`;
      }
    }
    boot();
  </script>
</body>
</html>
